idth="202.85" height="21" rx="3" fill="var(--_bg)"/><text x="589.07" y="475.4" text-anchor="middle">HTTPS · LINE push messages</text></g><g class="pele-edge-label" data-id="L_dashboard_firebase_0"><rect x="483.85" y="277.5" width="193.54" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="580.62" y="291.4">Google sign-in · live data and</tspan><tspan x="580.62" y="309.4">photos</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="fridge_sensor" transform="translate(218.2,51.5)"><rect x="-101.14" y="-43.5" width="202.29" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">F0 · Fridge sensor</tspan><tspan x="0" y="5.6">Temperature, VOC and</tspan><tspan x="0" y="26.6">light</tspan></text></g><g class="pele-node pele-shape-rect" data-id="gateway" transform="translate(218.2,211.5)"><rect x="-115.82" y="-43.5" width="231.65" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">C0 · Camera and gateway</tspan><tspan x="0" y="5.6">Local vision, BLE client and</tspan><tspan x="0" y="26.6">MQTT broker</tspan></text></g><g class="pele-node pele-shape-rect" data-id="door" transform="translate(122.03,386.5)"><rect x="-114.03" y="-43.5" width="228.06" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">D0 · Door closer</tspan><tspan x="0" y="5.6">Motor, obstruction and limit</tspan><tspan x="0" y="26.6">sensors</tspan></text></g><g class="pele-node pele-shape-rect" data-id="firebase" transform="translate(472.5,386.5)"><rect x="-111.81" y="-43.5" width="223.62" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">S · Firebase backend</tspan><tspan x="0" y="5.6">Cloud Functions, Firestore</tspan><tspan x="0" y="26.6">and Storage</tspan></text></g><g class="pele-node pele-shape-rect" data-id="dashboard" transform="translate(580.62,211.5)"><rect x="-102.94" y="-43.5" width="205.87" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">Phone or computer</tspan><tspan x="0" y="5.6">Food, device status and</tspan><tspan x="0" y="26.6">sensor history</tspan></text></g><g class="pele-node pele-shape-rect" data-id="gemini" transform="translate(355.93,551)"><rect x="-87.8" y="-33" width="175.6" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">G · Gemini API</tspan><tspan x="0" y="16.1">Grocery recognition</tspan></text></g><g class="pele-node pele-shape-rect" data-id="line" transform="translate(589.07,551)"><rect x="-105.34" y="-33" width="210.69" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">L · LINE Messaging API</tspan><tspan x="0" y="16.1">Expiry and safety alerts</tspan></text></g></g></svg>
