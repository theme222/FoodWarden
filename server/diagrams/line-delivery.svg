ash with session and 10-minute expiry</text></g><g class="pele-edge-label" data-id="i2"><text x="176.5" y="151.4" text-anchor="middle">Show one-use code</text></g><g class="pele-edge-label" data-id="i4"><rect x="482.92" y="218" width="246.44" height="17" rx="3" fill="#fff" stroke="none"/><text x="606.14" y="231.4" text-anchor="middle">POST /api/line/webhook with signature</text></g><g class="pele-edge-label" data-id="i5"><text x="517.38" y="270.9" text-anchor="middle">Verify bounded raw body HMAC-SHA256</text></g><g class="pele-edge-label" data-id="i6"><text x="537.69" y="304.4" text-anchor="middle">Dedup event, check live session, scope and role</text></g><g class="pele-edge-label" data-id="i7"><text x="537.69" y="341.4" text-anchor="middle">Atomically consume code and bind destination</text></g><g class="pele-edge-label" data-id="i8"><text x="606.14" y="378.4" text-anchor="middle">Webhook response</text></g><g class="pele-edge-label" data-id="i10"><text x="537.69" y="458.4" text-anchor="middle">Telemetry or door event triggers cooldown and outbox</text></g><g class="pele-edge-label" data-id="i11"><rect x="541.03" y="482" width="285.36" height="17" rx="3" fill="#fff" stroke="none"/><text x="683.71" y="495.4" text-anchor="middle">Daily family digest and orphan photo cleanup</text></g><g class="pele-edge-label" data-id="i12"><rect x="525.47" y="519" width="316.48" height="17" rx="3" fill="#fff" stroke="none"/><text x="683.71" y="532.4" text-anchor="middle">Every-minute personal digest and outbox dispatch</text></g><g class="pele-edge-label" data-id="i13"><text x="537.69" y="569.4" text-anchor="middle">Claim outbox lease and check current recipient</text></g><g class="pele-edge-label" data-id="i14"><rect x="461.92" y="593" width="288.44" height="17" rx="3" fill="#fff" stroke="none"/><text x="606.14" y="606.4" text-anchor="middle">Push bilingual messages with stable retry key</text></g><g class="pele-edge-label" data-id="i16"><text x="537.69" y="678.4" text-anchor="middle">Complete matching lease</text></g><g class="pele-edge-label" data-id="i18"><text x="537.69" y="748.4" text-anchor="middle">Schedule bounded retry with backoff</text></g><g class="pele-edge-label" data-id="i20"><text x="537.69" y="818.4" text-anchor="middle">Cancel stale delivery</text></g></g><g class="pele-notes" font-size="14" fill="#e6e6e6" stroke="#8a8a8a"><g class="pele-note" data-id="i3"><rect x="-16" y="171" width="891.28" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="429.64" y="192.4" text-anchor="middle">User sends code to bot in intended chat</text></g><g class="pele-note" data-id="i9"><rect x="337" y="398" width="401.37" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="537.69" y="419.4" text-anchor="middle">Lifecycle events use ordering watermarks and reset guards</text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="U"><rect x="-89.82" y="860" width="179.63" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="0" y="887.6" text-anchor="middle">Signed-in dashboard</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="S"><rect x="262.32" y="860" width="181.38" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="353" y="887.6" text-anchor="middle">Worker / LINE routes</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="D"><rect x="690.37" y="860" width="64" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="722.37" y="887.6" text-anchor="middle">D1</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="L"><rect x="794.37" y="860" width="129.81" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="859.28" y="887.6" text-anchor="middle">LINE platform</text></g><g c