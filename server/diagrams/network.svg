="630.4" text-anchor="middle">Periodic gateway heartbeat - planned sender</text></g><g class="pele-edge-label" data-id="i19"><rect x="838.56" y="654" width="326.94" height="17" rx="3" fill="#fff" stroke="none"/><text x="1002.03" y="667.4" text-anchor="middle">POST /api/status · C0, F0, D0 and last seen values</text></g><g class="pele-edge-label" data-id="i20"><text fill="#1f1f1f" x="826.53" y="704.4" text-anchor="middle">Return updated count</text></g></g><g class="pele-notes" font-size="14" fill="#e6e6e6" stroke="#8a8a8a"><g class="pele-note" data-id="i1"><rect x="-16" y="68" width="399.8" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="183.9" y="89.4" text-anchor="middle">Direct BLE GATT. Fridge sensor has no Wi-Fi.</text></g><g class="pele-note" data-id="i6"><rect x="351.8" y="205" width="738.37" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="720.99" y="226.4" text-anchor="middle">The local Mosquitto broker runs on C. D validates its TLS certificate.</text></g><g class="pele-note" data-id="i11"><rect x="351.8" y="396" width="738.37" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="720.99" y="417.4" text-anchor="middle">Door safety works on the local network if the internet fails.</text></g><g class="pele-note" data-id="i14"><rect x="351.8" y="459" width="949.46" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="826.53" y="480.4" text-anchor="middle">HTTPS with gateway Bearer token.</text></g><g class="pele-note" data-id="i21"><rect x="351.8" y="724" width="949.46" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="826.53" y="745.4" text-anchor="middle">Gateway and firmware entry points are scaffolds in this branch.</text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="F"><rect x="-83.33" y="789" width="166.66" height="44" f