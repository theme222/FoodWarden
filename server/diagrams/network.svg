ele-edge-label" data-id="i15"><text fill="var(--pele-fg-on-light,#1f1f1f)" x="543.3" y="519.4" text-anchor="middle">Send or retry buffered telemetry</text></g><g class="pele-edge-label" data-id="i16"><text fill="var(--pele-fg-on-light,#1f1f1f)" x="992.92" y="556.4" text-anchor="middle">POST /api/telemetry</text></g><g class="pele-edge-label" data-id="i17"><text fill="var(--pele-fg-on-light,#1f1f1f)" x="817.42" y="593.4" text-anchor="middle">Return ingested count</text></g><g class="pele-edge-label" data-id="i18"><text fill="var(--pele-fg-on-light,#1f1f1f)" x="543.3" y="630.4" text-anchor="middle">Heartbeat every 60 s per PR</text></g><g class="pele-edge-label" data-id="i19"><rect x="829.45" y="654" width="326.94" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="992.92" y="667.4" text-anchor="middle">POST /api/status · C0, F0, D0 and last seen values</text></g><g class="pele-edge-label" data-id="i20"><text fill="var(--pele-fg-on-light,#1f1f1f)" x="817.42" y="704.4" text-anchor="middle">Return updated count</text></g></g><g class="pele-notes" font-size="14" fill="var(--_a)" stroke="var(--_b)"><g class="pele-note" data-id="i1"><rect x="-16" y="68" width="399.8" height="33" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" x="183.9" y="89.4" text-anchor="middle">Direct BLE GATT. Fridge sensor has no Wi-Fi.</text></g><g class="pele-note" data-id="i6"><rect x="351.8" y="205" width="738.37" height="33" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" x="720.99" y="226.4" text-anchor="middle">The local Mosquitto broker runs on C. D validates its TLS certificate.</text></g><g class="pele-note" data-id="i11"><rect x="351.8" y="396" width="738.37" height="33" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" x="720.99" y="417.4" text-anchor="middle">Door safety works on the local network if the internet fails.</text></g><g class="pele-note" data-id="i14"><rect x="351.8" y="459" 