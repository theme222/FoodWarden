<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-sequence" viewBox="0 0 1810 856" width="1810" height="856" style="max-width:100%;height:auto;--_bg:#fff;--_fg:#1f1f1f;--_m:#6e6e6e;--_l:#1f1f1f;--_s:#f3f3f3;--_a:#e6e6e6;--_b:#8a8a8a;--_c:#5b7bd5;color:#1f1f1f;--_r:4px;--_hw:bold;--_fm:monospace;font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:sans-serif" fill="#1f1f1f" role="graphics-document document" aria-roledescription="sequence" aria-labelledby="pele-title" aria-describedby="pele-desc"><defs><filter id="foodwarden-edge-outline" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="0.9" result="outline"/><feFlood flood-color="#fff"/><feComposite in2="outline" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.pele-edges,.pele-lifelines{filter:url(#foodwarden-edge-outline)}.pele-edges{stroke-width:1.75}</style><title id="pele-title">Fridge sensor BLE telemetry design</title><desc id="pele-desc">Planned behavior from FUC and the project summary. Firmware and gateway implementations are still scaffolds on this branch.</desc><g transform="translate(216.04,8)"><g class="pele-lifelines" fill="none" stroke="#8a8a8a"><path class="pele-lifeline" data-id="F" d="M0,44V796"/><path class="pele-lifeline" data-id="C" d="M449.4,44V796"/><path class="pele-lifeline" data-id="Q" d="M871.7,44V796"/><path class="pele-lifeline" data-id="S" d="M1237.17,44V796"/></g><g class="pele-frames" font-size="14" stroke="#8a8a8a"><g class="pele-frame pele-frame-alt"><rect x="851.7" y="483" width="733.93" height="250" fill="none" style="rx:4px"/><path d="M851.7,664H1585.63" stroke-dasharray="4 4"/><rect x="856.7" y="668" width="135.96" height="17" rx="3" fill="#fff" stroke="none"/><text class="pele-frame-label" fill="#6e6e6e" stroke="none" x="924.68" y="681.4" text-anchor="middle">[Internet unavailable]</text><rect x="851.7" y="483" width="28" height="20" fill="#f3f3f3" style="rx:4px"/><text class="pele-frame-kind" x="865.7" y="497.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e6e6e" stroke="none">alt</text><text class="pele-frame-label" fill="#6e6e6e" stroke="none" x="944.9" y="498.4" text-anchor="middle">[Internet available]</text></g></g><g class="pele-edges" fill="none" stroke="#1f1f1f" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i1"><path d="M0,107H22A6,6 0 0 1 28,113V123A6,6 0 0 1 22,129H7"/><path class="pele-marker" d="M0,129L8,125.64L8,132.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i3"><path d="M449.4,209H7"/><path class="pele-marker" d="M0,209L8,205.64L8,212.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i4"><path d="M449.4,246H7"/><path class="pele-marker" d="M0,246L8,242.64L8,249.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i5"><path d="M0,260H22A6,6 0 0 1 28,266V276A6,6 0 0 1 22,282H7"/><path class="pele-marker" d="M0,282L8,278.64L8,285.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i7"><path d="M0,362H442.4" stroke-dasharray="4 4"/><path class="pele-marker" d="M449.4,362L441.4,365.36L441.4,358.64Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i8"><path d="M449.4,376H471.4A6,6 0 0 1 477.4,382V392A6,6 0 0 1 471.4,398H456.4"/><path class="pele-marker" d="M449.4,398L457.4,394.64L457.4,401.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i9"><path d="M449.4,435H864.7"/><path class="pele-marker" d="M871.7,435L863.7,438.36L863.7,431.64Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i10"><path d="M0,449H22A6,6 0 0 1 28,455V465A6,6 0 0 1 22,471H7"/><path class="pele-marker" d="M0,471L8,467.64L8,474.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i12"><path d="M871.7,543H1230.17"/><path class="pele-marker" d="M1237.17,543L1229.17,546.36L1229.17,539.64Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i13"><path d="M1237.17,557H1259.17A6,6 0 0 1 1265.17,563V573A6,6 0 0 1 1259.17,579H1244.17"/><path class="pele-marker" d="M1237.17,579L1245.17,575.64L1245.17,582.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i14"><path d="M1237.17,616H878.7" stroke-dasharray="4 4"/><path class="pele-marker" d="M871.7,616L879.7,612.64L879.7,619.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i15"><path d="M871.7,630H893.7A6,6 0 0 1 899.7,636V646A6,6 0 0 1 893.7,652H878.7"/><path class="pele-marker" d="M871.7,652L879.7,648.64L879.7,655.36Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge pele-message" data-id="i17"><path d="M871.7,699H893.7A6,6 0 0 1 899.7,705V715A6,6 0 0 1 893.7,721H878.7"/><path class="pele-marker" d="M871.7,721L879.7,717.64L879.7,724.36Z" fill="#1f1f1f" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i1"><text x="209.89" y="122.9" text-anchor="middle">Wake, FreeRTOS tasks sample LM73, SGP40 and LDR</text></g><g class="pele-edge-label" data-id="i3"><text x="224.7" y="199.4" text-anchor="middle">Connect, negotiate MTU at least 128</text></g><g class="pele-edge-label" data-id="i4"><text x="224.7" y="236.4" text-anchor="middle">Write 8-byte little-endian Unix time to FFF2</text></g><g class="pele-edge-label" data-id="i5"><text x="141.04" y="275.9" text-anchor="middle">Pack 1 to 6 timestamped samples</text></g><g class="pele-edge-label" data-id="i7"><text x="224.7" y="352.4" text-anchor="middle">FFF1 notify: AAD header, AES-128-GCM ciphertext and tag</text></g><g class="pele-edge-label" data-id="i8"><text x="665.55" y="391.9" text-anchor="middle">Authenticate, check session/counter and decode sentinels</text></g><g class="pele-edge-label" data-id="i9"><text x="660.55" y="425.4" text-anchor="middle">Persist validated sample before cloud delivery</text></g><g class="pele-edge-label" data-id="i10"><text x="184.64" y="464.9" text-anchor="middle">Finish bounded BLE cycle and enter deep sleep</text></g><g class="pele-edge-label" data-id="i12"><text x="1054.43" y="533.4" text-anchor="middle">HTTPS Bearer POST /api/telemetry</text></g><g class="pele-edge-label" data-id="i13"><text x="1414.4" y="572.9" text-anchor="middle">Dedup by fridge, node and sample timestamp</text></g><g class="pele-edge-label" data-id="i14"><text x="1054.43" y="606.4" text-anchor="middle">Ingested count</text></g><g class="pele-edge-label" data-id="i15"><text x="992.13" y="645.9" text-anchor="middle">Retire acknowledged batch</text></g><g class="pele-edge-label" data-id="i17"><text x="1059.43" y="714.9" text-anchor="middle">Retain records and retry with exponential backoff</text></g></g><g class="pele-notes" font-size="14" fill="#e6e6e6" stroke="#8a8a8a"><g class="pele-note" data-id="i0"><rect x="-16" y="60" width="481.4" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="224.7" y="81.4" text-anchor="middle">BLE GATT peripheral F and central C, sensor uses no Wi-Fi</text></g><g class="pele-note" data-id="i2"><rect x="-208.04" y="139" width="416.09" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="0" y="160.4" text-anchor="middle">Sensor failure becomes defined sentinel, not a blocked I2C loop</text></g><g class="pele-note" data-id="i6"><rect x="-16" y="292" width="481.4" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="224.7" y="313.4" text-anchor="middle">15-byte authenticated header: version, node ID, session salt, counter</text></g><g class="pele-note" data-id="i19"><rect x="-16" y="743" width="481.4" height="33" style="rx:4px"/><text class="pele-label" stroke="none" fill="#1f1f1f" x="224.7" y="764.4" text-anchor="middle">Application ACK/retry details need implementation and PDR measurement</text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="F"><rect x="-77.36" y="796" width="154.72" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="0" y="823.6" text-anchor="middle">F0 sensor design</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="C"><rect x="365.37" y="796" width="168.06" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="449.4" y="823.6" text-anchor="middle">C0 gateway design</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="Q"><rect x="758.77" y="796" width="225.87" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="871.7" y="823.6" text-anchor="middle">Durable local queue design</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="S"><rect x="1146.93" y="796" width="180.48" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="1237.17" y="823.6" text-anchor="middle">Implemented Worker</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="F"><rect x="-77.36" y="0" width="154.72" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="0" y="27.6" text-anchor="middle">F0 sensor design</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="C"><rect x="365.37" y="0" width="168.06" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="449.4" y="27.6" text-anchor="middle">C0 gateway design</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="Q"><rect x="758.77" y="0" width="225.87" height="44" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px"/><text class="pele-label" x="871.7" y="27.6" text-anchor="middle">Durable local queue design</text></g><g class="pe