; PlatformIO Project Configuration File — Node 'F' (Fridge Internal Sensor)
; Hardware: KidBright32 (ESP32-WROOM-32)
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I.
    -Wall
    -Wextra
    ; ESP32 longs and pointers are 32-bit, so Unity would disable the
    ; TEST_ASSERT_*_UINT64 checks used by test/test_node_state (pio test)
    -DUNITY_SUPPORT_64
lib_deps =
    sensirion/Sensirion I2C SGP40
    sensirion/Sensirion Gas Index Algorithm
    sensirion/Sensirion I2C SHT3x
    h2zero/NimBLE-Arduino@^1.4.3
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --inline-suppr
check_skip_packages = yes
