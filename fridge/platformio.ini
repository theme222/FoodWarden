; PlatformIO Project Configuration File — Node 'F' (Fridge Internal Sensor)
; Hardware: KidBright32 (ESP32-WROOM-32)
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I.
    -Wall
    -Wextra
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --inline-suppr
