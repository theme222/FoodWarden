# Mosquitto MQTTS Broker Configuration for FoodWarden Node 'C' (Pi-top [4])
# Copy to: /etc/mosquitto/conf.d/foodwarden-tls.conf

# Disable unencrypted port 1883 externally; bind TLS listener on 8883
listener 8883 0.0.0.0
protocol mqtt

# TLS 1.2+ Certificates
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# Require username/password authentication (MQTT_USERNAME / MQTT_PASSWORD)
allow_anonymous false
password_file /etc/mosquitto/passwd

# Persistence for QoS 1 messages
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

