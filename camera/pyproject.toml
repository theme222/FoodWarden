[project]
name = "foodwarden-camera"
version = "0.1.0"
description = "FoodWarden Edge Gateway & Camera Logger (Node 'C' - Pi-top [4])"
readme = "README.md"
authors = [
    { name = "Theme222", email = "sira.tongsima@yahoo.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "bleak>=0.22.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "opencv-python>=4.10.0",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.7.0",
    "PyQt6>=6.7.0,<6.9.0; platform_machine != 'aarch64'",
    "python-dotenv>=1.0.0",
    "torch>=2.2.0,<2.5.0; platform_machine == 'aarch64'",
    "torchvision>=0.17.0,<0.20.0; platform_machine == 'aarch64'",
    "ultralytics>=8.3.0",
]

[tool.uv]
override-dependencies = [
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
foodwarden-camera = "foodwarden_camera:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "PyQt6",
    "PyQt6.*",
    "ultralytics",
    "ultralytics.*",
    "cv2",
    "cv2.*",
]
ignore_missing_imports = true
